<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BEAT COP: Donut Justice</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;font-family:monospace;color:#fff;-webkit-user-select:none;user-select:none}
canvas{position:fixed;left:0;top:0;image-rendering:pixelated}
#hud{position:fixed;left:6px;top:6px;font-size:13px;line-height:16px;text-shadow:1px 1px #000;pointer-events:none}
#bars div{height:6px;width:90px;background:#333;margin:2px 0}#bars i{display:block;height:100%}
#radio{position:fixed;left:6px;right:120px;bottom:auto;top:84px;font-size:12px;color:#7f7;text-shadow:1px 1px #000;pointer-events:none}
#obj{position:fixed;left:0;right:0;bottom:4px;text-align:center;font-size:12px;color:#ff6;text-shadow:1px 1px #000;pointer-events:none}
.btn{position:fixed;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:bold;font-size:13px;text-align:center}
#pauseB{position:fixed;right:110px;top:6px;padding:4px 8px;background:rgba(0,0,0,.5);border:1px solid #fff}

#box h2{margin:0 0 6px;color:#fc3;font-size:17px}#box button{display:block;width:100%;margin:5px 0;padding:9px;font:14px monospace;background:#335;color:#fff;border:2px solid #88a;border-radius:4px}
#box button:active{background:#557}.meter{height:10px;background:#333;margin:3px 0}.meter i{display:block;height:100%}
</style></head><body>
<canvas id="c"></canvas>
<div id="obj"></div>
<div id="hud"><span id="clock"></span> | Score <span id="score">0</span> | Rep <span id="rep">50</span><br><span id="status"></span><div id="bars"><div><i id="hpb" style="background:#e33"></i></div><div><i id="stb" style="background:#3be"></i></div></div></div>
<div id="radio"></div>
<div id="pauseB">II</div>
<div id="modal"><div id="box"></div></div>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const T=16,P=12,N=72; // tile size, block period, map tiles
let W,H,Z;
function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;Z=Math.max(2,Math.round(Math.min(W,H)/200));layoutButtons();}
// ---------- RNG / utils
const R=Math.random,rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(R()*a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>v<a?a:v>b?b:v;
// ---------- MAP: 0 road,1 sidewalk,2 building,3 park,4 crosswalk
const map=new Uint8Array(N*N),bcol=[];
const isRoadC=v=>(v%P)<3;
for(let y=0;y<N;y++)for(let x=0;x<N;x++){let t;
 const rx=isRoadC(x),ry=isRoadC(y);
 if(rx||ry)t=0;else if(x%P==3||x%P==P-1||y%P==3||y%P==P-1)t=1;else t=2;
 if(x<1||y<1||x>=N-1||y>=N-1)t=2;
 map[y*N+x]=t;}
const blocks={};const BN=Math.floor(N/P);
for(let by=0;by<BN;by++)for(let bx=0;bx<BN;bx++)blocks[bx+','+by]={col:pick(['#a65','#865','#669','#777','#596','#a87','#957']),name:pick(['Apartments','Pawn Shop','Laundromat','Pizza Place','Bank','Bodega','Arcade','Tax Office','Gym','Bookstore'])};
if(1){const park=blocks['4,1'];park.name='Park';for(let y=1*P+4;y<1*P+P-1;y++)for(let x=4*P+4;x<4*P+P-1;x++)map[y*N+x]=3;}
blocks['1,1'].name='POLICE';blocks['1,1'].col='#349';
blocks['3,3'].name='DONUTS';blocks['3,3'].col='#e8a';
blocks['4,4'].name='Bank';blocks['4,4'].col='#bb8';
const tile=(x,y)=>(x<0||y<0||x>=N||y>=N)?2:map[(y|0)*N+(x|0)];
const solidAt=(px,py)=>{const t=tile(px/T,py/T);return t==2};
function blockCenter(bx,by){return{x:(bx*P+7.5)*T,y:(by*P+7.5)*T}}
function doorOf(bx,by){return{x:(bx*P+7.5)*T,y:(by*P+P-1+.5)*T}} // south sidewalk
const STATION=doorOf(1,1),DONUT=doorOf(3,3);
// ---------- state
const S={time:8*60,score:0,rep:50,hp:100,st:100,paused:false,modal:false,arrests:0,donuts:0,over:false,msgs:[],shake:0};
const me={x:STATION.x,y:STATION.y+T*2,dir:0,anim:0,inCar:false,carry:null,tackle:0};
const patrol={x:STATION.x+T*3,y:STATION.y+T*2.5,a:0,v:0,siren:false,police:true,col:'#fff'};
let peds=[],cars=[],crimes=[],parts=[],floaters=[];
const FIRST=['Vinnie','Barb','Dusty','Gus','Marge','Skeeter','Tony','Lulu','Clem','Rex','Dolores','Chad','Brenda','Moose','Earl'];
const LAST=['Pastrami','McGillicuddy','Bonkowski','Fettucini','Schlotz','Wigglesworth','Dingle','Kowalczyk','Pfeiffer','Throckmorton'];
const CRIMES={shoplift:{n:'Shoplifting',code:'10-SL',pts:100,flee:1},jaywalk:{n:'Jaywalking',code:'10-JW',pts:40,flee:0.4},vandal:{n:'Vandalism',code:'10-VD',pts:80,flee:0.8},mug:{n:'Mugging',code:'10-MG',pts:150,flee:1,hit:1},gta:{n:'Grand Theft Auto',code:'10-GTA',pts:250,car:1}};
function randWalkTile(type){for(let i=0;i<500;i++){const x=ri(1,N-2),y=ri(1,N-2);if(map[y*N+x]==type)return{x:(x+.5)*T,y:(y+.5)*T}}return{x:T*4,y:T*4}}
function mkPed(){const p=randWalkTile(1);return{x:p.x,y:p.y,dx:0,dy:0,t:0,name:pick(FIRST)+' '+pick(LAST),shirt:pick(['#c33','#3c3','#cc3','#c6c','#3cc','#fa3','#eee','#555']),skin:pick(['#fdb','#c96','#863','#fca']),hair:pick(['#222','#a62','#ee8','#888','#d33']),crime:null,state:'walk',cuffed:false,spd:rnd(18,28)};}
for(let i=0;i<45;i++)peds.push(mkPed());
function roadPoint(){const lines=[];for(let k=0;k*P<N;k++)lines.push((k*P+1.5)*T);
 if(R()<.5)return{x:pick(lines),y:rnd(2,N-2)*T,a:pick([Math.PI/2,-Math.PI/2])};return{x:rnd(2,N-2)*T,y:pick(lines),a:pick([0,Math.PI])}}
function mkCar(){const p=roadPoint();return{x:p.x,y:p.y,a:p.a,v:rnd(35,55),col:pick(['#d33','#36d','#ec3','#3a5','#eee','#a5c','#f80']),ai:true,lastI:-1,flee:false,stopped:0}}
for(let i=0;i<16;i++)cars.push(mkCar());
// ---------- detective case
const CASE={active:true,found:0,solved:false,clues:[],suspects:[],culprit:null};
(function(){const names=['Big Sal Fettucini','"Sprinkles" McGee','Prof. Cruller'];CASE.suspects=names;CASE.culprit=1;
 const spots=[[0,4,'A trail of pink frosting... leads AWAY from the Bank. Someone with a sweet tooth.'],[5,2,'A receipt: "1x Ski mask (sprinkle pattern)". Paid in rolled pennies.'],[2,5,'Witness parrot says: "SQUAWK! TALL ONE! NOT A PROFESSOR! SQUAWK!"']];
 for(const s of spots){const d=doorOf(s[0],s[1]);CASE.clues.push({x:d.x+T*2,y:d.y,text:s[2],got:false})}})();
// ---------- radio
function radio(t,c){S.msgs.unshift({t,c:c||'#7f7',life:9});if(S.msgs.length>4)S.msgs.pop();}
function floatTxt(x,y,t,c){floaters.push({x,y,t,c:c||'#ff0',life:1.6})}
// ---------- crimes
function spawnCrime(){const types=['shoplift','jaywalk','vandal','mug','shoplift','jaywalk','gta'];const ty=pick(types);
 if(ty=='gta'){const c=pick(cars.filter(c=>c.ai&&!c.flee&&dist(c,me)<T*40&&dist(c,me)>T*8));if(!c)return;c.flee=true;c.v=95;c.crime='gta';c.thief=mkPed();c.thief.crime='gta';radio('DISPATCH: 10-GTA! Stolen '+colName(c.col)+' sedan, all units! Ram it to stop it.','#f88');crimes.push({t:'gta',car:c});return;}
 const cand=peds.filter(p=>!p.crime&&!p.cuffed&&dist(p,me)<T*35);if(!cand.length)return;const p=pick(cand);p.crime=ty;p.state='crime';p.ct=0;
 const where=blockOf(p);radio('DISPATCH: '+CRIMES[ty].code+' '+CRIMES[ty].n+' near the '+where+'. Suspect: '+p.name.split(' ')[0]+', '+colName(p.shirt)+' shirt.','#ff8');
 if(ty=='jaywalk'){const r=nearestRoad(p);if(r){p.tx=r.x;p.ty=r.y}}crimes.push({t:ty,ped:p});}
function colName(c){return({'#c33':'red','#3c3':'green','#cc3':'yellow','#c6c':'purple','#3cc':'teal','#fa3':'orange','#eee':'white','#555':'grey','#d33':'red','#36d':'blue','#ec3':'yellow','#3a5':'green','#a5c':'purple','#f80':'orange'})[c]||'ugly'}
function blockOf(p){const bx=Math.floor(p.x/T/P),by=Math.floor(p.y/T/P);const b=blocks[bx+','+by];return b?b.name:'outskirts'}
function nearestRoad(p){const tx=p.x/T|0,ty=p.y/T|0;for(let r=1;r<6;r++)for(const[dx,dy]of[[r,0],[-r,0],[0,r],[0,-r]])if(tile(tx+dx,ty+dy)==0)return{x:(tx+dx*2+.5)*T,y:(ty+dy*2+.5)*T};return null}
// ---------- input
const keys={};let joy={x:0,y:0,active:false,id:null,ox:0,oy:0},btnA=false,btnB=false,btnS=false,pressA=false,pressB=false;
addEventListener('keydown',e=>{if(!keys[e.code]){if(e.code=='Space'||e.code=='KeyJ')pressA=true;if(e.code=='KeyE'||e.code=='KeyK')pressB=true;if(e.code=='KeyP'||e.code=='Escape')togglePause();if(e.code=='KeyH')S.siren=!S.siren}keys[e.code]=true;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);
const buttons=[];function mkBtn(label,on,off){const d=document.createElement('div');d.className='btn';d.innerHTML=label;document.body.appendChild(d);
 d.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();on()},{passive:false});d.addEventListener('touchend',e=>{e.preventDefault();off&&off()},{passive:false});
 d.addEventListener('mousedown',e=>{on()});d.addEventListener('mouseup',e=>{off&&off()});buttons.push(d);return d}
const bA=mkBtn('A<br><small>ACT</small>',()=>{pressA=true;btnA=true},()=>btnA=false);
const bB=mkBtn('B<br><small>CAR</small>',()=>{pressB=true},null);
const bS=mkBtn('RUN',()=>btnS=true,()=>btnS=false);
const bH=mkBtn('🚨',()=>{S.siren=!S.siren},null);
function layoutButtons(){const s=Math.max(56,Math.min(W,H)*0.16);const set=(d,r,b,k)=>{d.style.width=d.style.height=(s*k)+'px';d.style.right=r+'px';d.style.bottom=b+'px'};
 if(!buttons.length)return;set(bA,16,s*0.9,1.1);set(bB,s*1.35,16,1);set(bS,s*1.35+s*1.05,s*0.2,0.8);set(bH,16,s*2.2,0.7);}
document.getElementById('pauseB').addEventListener('click',togglePause);document.getElementById('pauseB').addEventListener('touchstart',e=>{e.preventDefault();togglePause()});
cv.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){if(joy.id===null&&t.clientX<W*0.55){joy.id=t.identifier;joy.ox=t.clientX;joy.oy=t.clientY;joy.active=true;joy.x=joy.y=0}}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joy.id){let dx=t.clientX-joy.ox,dy=t.clientY-joy.oy,m=Math.hypot(dx,dy),mx=50;if(m>mx){dx*=mx/m;dy*=mx/m}joy.x=dx/mx;joy.y=dy/mx}},{passive:false});
const jend=e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){joy.id=null;joy.active=false;joy.x=joy.y=0}};cv.addEventListener('touchend',jend);cv.addEventListener('touchcancel',jend);
function inputVec(){let x=joy.x,y=joy.y;if(keys.KeyA||keys.ArrowLeft)x-=1;if(keys.KeyD||keys.ArrowRight)x+=1;if(keys.KeyW||keys.ArrowUp)y-=1;if(keys.KeyS||keys.ArrowDown)y+=1;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}return{x,y,m:Math.min(1,m)}}
// ---------- modal
const modal=document.getElementById('modal'),box=document.getElementById('box');
function showModal(html,btns){S.modal=true;modal.style.display='flex';box.innerHTML=html;for(const b of btns||[]){const e=document.createElement('button');e.innerHTML=b[0];e.onclick=()=>b[1]();box.appendChild(e)}}
function closeModal(){S.modal=false;modal.style.display='none'}
function togglePause(){if(S.modal&&!S.paused)return;S.paused=!S.paused;if(S.paused)showModal(`<h2>⏸ PAUSED — BEAT COP</h2>
<b>Goal:</b> Survive your shift (08:00–16:00). Arrest perps, book them at the 🚓 POLICE station, do the paperwork, eat donuts, solve the Great Donut Heist.<br><br>
<b>Touch:</b> left side = joystick · <b>A</b> act (tackle / cuff / buy donut / pick up clue / book) · <b>B</b> enter/exit car · <b>RUN</b> sprint (hold) · 🚨 siren<br>
<b>Keys:</b> WASD/Arrows move · Space/J act · E/K car · Shift sprint · H siren · P/Esc pause<br><br>
<b>Tips:</b> Red <b>!</b> = crime in progress. Chase, press A close by to tackle, A again to cuff. Cuffed perps follow you — walk or drive to the station door. Ram stolen cars with your cruiser until they stop. Yellow <b>?</b> = case clue. Pink dot on minimap = DONUTS. Running drains stamina; donuts fix everything.<br><br>
Case: ${CASE.solved?'SOLVED':CASE.found+'/3 clues'} · Arrests: ${S.arrests} · Donuts: ${S.donuts}`,[['▶ Resume',()=>{S.paused=false;closeModal()}],['🔄 Restart shift',()=>location.reload()]]);else closeModal()}
// ---------- interrogation
const QUIRKS=[{n:'a softie',good:2,bad:-1},{n:'a tough nut',good:-1,bad:2},{n:'a hungry guy',good:1,bad:0,donut:3},{n:'a drama queen',good:1,bad:1}];
function interrogate(p,done){const q=pick(QUIRKS);let coop=1,anger=0,round=0;const crime=CRIMES[p.crime]||CRIMES.shoplift;
 const lines={good:['"Look, we all make mistakes. Wanna talk about it?"','"I get it. Rough week? Mine too."','"You seem like a decent person under the felony."'],bad:['*SLAMS TABLE* "TALK!"','"Your buddy already ratted you out!" (he did not)','*leans in uncomfortably close* "I have ALL NIGHT."'],donut:'"Donut? Glazed. Still warm."'};
 const reply={up:['"...okay okay, maybe I did a LITTLE crime."','"Fine! But I want it on record I was framed by my own hands."','*sobs* "It was the sprinkles, they made me do it!"'],down:['"I want my lawyer. And a sandwich."','"I know my rights! I watched a TV show once!"','"..." *stares at wall*']};
 function step(txt){const meter=`<div>Cooperation</div><div class="meter"><i style="width:${Math.min(100,coop*20)}%;background:#3c6"></i></div><div>Anger</div><div class="meter"><i style="width:${Math.min(100,anger*25)}%;background:#c33"></i></div>`;
  if(coop>=5){let extra='';if(CASE.active&&!CASE.solved&&R()<.6)extra=`<br><br>🕵 <i>"Also... I heard ${CASE.suspects[CASE.culprit]} was bragging about free donuts for life."</i>`;
   showModal(`<h2>CONFESSION!</h2>${p.name} sings like a canary. +100 pts, +3 rep.${extra}`,[['To the paperwork... 😩',()=>{S.score+=100;S.rep+=3;done(true)}]]);return}
  if(anger>=4||round>=5){showModal(`<h2>Lawyered up.</h2>${p.name} says nothing further. ${anger>=4?'You may have yelled a bit much. -2 rep.':'You ran out of time.'}`,[['Ugh. Paperwork.',()=>{if(anger>=4)S.rep-=2;done(false)}]]);return}
  showModal(`<h2>🗣 INTERROGATION — ${p.name}</h2><i>Charge: ${crime.n}. Your gut says they're ${q.n}.</i><br><br>${txt}<br>${meter}`,[
   ['😇 Good cop: '+pick(lines.good),()=>{round++;coop+=q.good;if(q.good<0)anger+=0.5;step(q.good>0?pick(reply.up):pick(reply.down))}],
   ['😠 Bad cop: '+pick(lines.bad),()=>{round++;coop+=q.bad;anger+=1;step(q.bad>0?pick(reply.up):pick(reply.down))}],
   ['🍩 Offer donut'+(S.donuts?' ('+S.donuts+' left)':' (you have none)'),()=>{round++;if(S.donuts>0){S.donuts--;coop+=q.donut||1.5;anger=Math.max(0,anger-1);step('"...is this... Boston Cream?" *eyes moisten*')}else step('You pat your pockets. No donuts. Awkward silence.')}],
   ['🤐 Silent treatment (stare)',()=>{round++;if(R()<.4){coop+=2;step('The silence gets to them. "OKAY STOP LOOKING AT ME LIKE THAT."')}else step('They stare back. You both blink. Nobody wins.')}]])}
 step(`${p.name} sits in Room B, sweating. The coffee machine gurgles ominously.`)}
// ---------- paperwork
function typo(s){const a=s.split('');const i=ri(1,a.length-2);const m=ri(0,2);if(m==0){[a[i],a[i+1]]=[a[i+1],a[i]]}else if(m==1)a[i]=pick('aeiouxzq'.split(''));else a.splice(i,0,a[i]);return a.join('')}
function paperwork(p,done){let errors=0,stage=0;const crime=CRIMES[p.crime]||CRIMES.shoplift;const t0=performance.now();
 const forms=['Form 27-B/6 (Arrest)','Form 99-Q (Feelings About Arrest)','Form 12-Z (Request For More Forms)'];
 function next(){stage++;if(stage==1){let opts=[p.name,typo(p.name),typo(p.name),typo(p.name)].sort(()=>R()-.5);
   showModal(`<h2>📝 ${forms[0]}</h2>Box 1: Suspect's full legal name (spelled CORRECTLY, Officer):`,opts.map(o=>[o,()=>{if(o!=p.name){errors++;floatTxt(me.x,me.y,'TYPO!','#f55')}next()}]))}
  else if(stage==2){const codes=Object.values(CRIMES).map(c=>c.code+' – '+c.n);codes.push('10-WTF – Unspecified Weirdness');
   showModal(`<h2>📝 ${forms[0]}</h2>Box 7c: Select the crime code. (Sergeant Krupke is watching.)`,codes.sort(()=>R()-.5).map(c=>[c,()=>{if(!c.startsWith(crime.code+' '))errors++;next()}]))}
  else if(stage==3){showModal(`<h2>📝 ${forms[1]}</h2>On a scale of 1–5, how did this arrest make you feel?`,[['1 – Nothing. I am the law.',next],['3 – Mild indigestion.',next],['5 – I need a donut.',()=>{next()}],['Leave blank',()=>{errors++;next()}]])}
  else if(stage==4){let stamps=0;const need=3;const st0=performance.now();
   const draw=()=>showModal(`<h2>📝 ${forms[2]}</h2>STAMP IN TRIPLICATE! Fast, before the copier jams.<br><br><div style="font-size:32px;text-align:center">${'✅'.repeat(stamps)}${'⬜'.repeat(need-stamps)}</div>`,[['🔨 STAMP',()=>{stamps++;if(stamps>=need){if(performance.now()-st0>4000){errors++;floatTxt(me.x,me.y,'COPIER JAMMED','#f55')}next()}else draw()}]]);draw()}
  else{const secs=((performance.now()-t0)/1000)|0;const pts=Math.max(0,crime.pts-errors*30)+(secs<15?50:0);S.score+=pts;S.rep+=errors?-errors:2;
   showModal(`<h2>${errors?'📎 Paperwork filed (badly)':'🏅 Flawless paperwork!'}</h2>Time: ${secs}s · Errors: ${errors}<br>${errors?'The Sergeant sighs so hard his mustache moves. ':'The Sergeant nods. Once. A rare honor. '}+${pts} pts<br><br><i>${pick(['Only 46 more forms till retirement.','The coffee is cold. It was always cold.','Your pen dies. Another pen dies. All pens die.'])}</i>`,[['Back to the beat 🚔',()=>{closeModal();done()}]])}}
 showModal(`<h2>🗂 BOOKING: ${p.name}</h2>Charge: ${crime.n}. Before you can go, the city requires ${forms.length} forms. Typos will be penalized. Speed is rewarded.`,[['Begin the suffering',next]])}
function book(p){S.arrests++;interrogate(p,()=>paperwork(p,()=>{peds=peds.filter(x=>x!=p);peds.push(mkPed());me.carry=null;}))}
// ---------- case
function caseSolve(){showModal(`<h2>🕵 THE GREAT DONUT HEIST</h2>Someone robbed the Bank's vault... of the employee donut fund. You have all 3 clues:<ul>${CASE.clues.map(c=>'<li>'+c.text+'</li>').join('')}</ul>Who's the culprit?`,CASE.suspects.map((s,i)=>[s,()=>{
 if(i==CASE.culprit){CASE.solved=true;S.score+=1000;S.rep+=15;showModal(`<h2>🎉 CASE CLOSED!</h2>${s} confesses: "The sprinkle mask... it was too fabulous not to wear." +1000 pts, +15 rep. The Chief gives you a coupon for ONE free coffee.`,[['Heck yeah',closeModal]])}
 else{S.rep-=5;showModal(`<h2>❌ Wrong suspect</h2>${s} has an airtight alibi (they were at a book club for people who hate donuts). -5 rep. Think harder, detective.`,[['Hmm...',closeModal]])}}]))}
// ---------- update
let spawnT=4,last=performance.now();
function moveEnt(e,dx,dy,r){const nx=e.x+dx,ny=e.y+dy;let hit=false;
 if(!solidAt(nx-r,e.y-r)&&!solidAt(nx+r,e.y-r)&&!solidAt(nx-r,e.y+r)&&!solidAt(nx+r,e.y+r))e.x=nx;else hit=true;
 if(!solidAt(e.x-r,ny-r)&&!solidAt(e.x+r,ny-r)&&!solidAt(e.x-r,ny+r)&&!solidAt(e.x+r,ny+r))e.y=ny;else hit=true;return hit}
function update(dt){

 ctx.imageSmoothingEnabled=false;ctx.drawImage(render.mm,mx0,my0,ms,ms);ctx.globalAlpha=1;
