<script>
"use strict";
const VERSION='2.0.0';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const T=16,P=12,N=75,BN=6,TAU=Math.PI*2;
let W=1,H=1,DPR=1,Z=3;
const R=Math.random,rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(R()*a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d};
const $=id=>document.getElementById(id);
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g]}
// ---------- 3x5 pixel font
const FONT={};(function(){const d={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','!':'010010010000010','?':'110001010000010','.':'000000000000010',',':'000000000010100',"'":'010010000000000','"':'101101000000000','-':'000000111000000','+':'000010111010000',':':'000010000010000','/':'001001010100100','$':'011110010011110','*':'101010101000000','(':'010100100100010',')':'010001001001010','#':'101111101111101','%':'101001010100101','&':'010101010101011',' ':'000000000000000','>':'100010001010100','<':'001010100010001','=':'000111000111000','_':'000000000000111'};for(const k in d)FONT[k]=d[k]})();
const textCache=new Map();
function textCanvas(s,col,shadow){const key=s+'|'+col+'|'+shadow;let c=textCache.get(key);if(c)return c;if(textCache.size>400)textCache.clear();
 s=String(s).toUpperCase();const w=s.length*4+1,h=7;const[cc,g]=mkCanvas(w,h);
 const draw=(ox,oy,cl)=>{g.fillStyle=cl;for(let i=0;i<s.length;i++){const gl=FONT[s[i]]||FONT['?'];for(let b=0;b<15;b++)if(gl[b]=='1')g.fillRect(ox+i*4+b%3,oy+(b/3|0),1,1)}};
 if(shadow)draw(1,1,shadow);draw(0,0,col);textCache.set(key,cc);return cc}
function ptext(g,s,x,y,col='#fff',sc=1,align='center',shadow='#000'){const c=textCanvas(s,col,shadow);const w=c.width*sc;const ox=align=='center'?x-w/2:align=='right'?x-w:x;g.drawImage(c,Math.round(ox),Math.round(y),w,c.height*sc)}
// ---------- save
const SAVE_KEY='beatcop_save_v2';
let SAVE={career:0,shifts:0,best:0,cases:0,arrests:0,muted:false,music:true,vib:true,caseIdx:0};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'))}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE))}catch(e){}}
const RANKS=[[0,'Cadet'],[800,'Patrol Officer'],[2500,'Senior Officer'],[5000,'Corporal'],[9000,'Sergeant'],[15000,'Detective'],[24000,'Lieutenant'],[36000,'Captain'],[55000,'Commissioner']];
function rankOf(x){let r=RANKS[0][1];for(const k of RANKS)if(x>=k[0])r=k[1];return r}
function nextRank(x){for(const k of RANKS)if(x<k[0])return k;return null}
// ---------- haptics
function vib(p){if(SAVE.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
// ---------- audio
const AU={ctx:null,sfx:null,mus:null,master:null,nb:null,siren:null,step:0,next:0,intense:0};
function audioInit(){if(AU.ctx){if(AU.ctx.state!='running')AU.ctx.resume();return}
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{AU.ctx=new C()}catch(e){return}
 const a=AU.ctx;AU.master=a.createGain();AU.master.gain.value=SAVE.muted?0:0.7;AU.master.connect(a.destination);
 AU.sfx=a.createGain();AU.sfx.gain.value=0.8;AU.sfx.connect(AU.master);AU.mus=a.createGain();AU.mus.gain.value=SAVE.music?0.22:0;AU.mus.connect(AU.master);
 const len=a.sampleRate;AU.nb=a.createBuffer(1,len,a.sampleRate);const d=AU.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=R()*2-1;
 AU.next=a.currentTime+0.1;setInterval(musicTick,40)}
function setMuted(m){SAVE.muted=m;persist();if(AU.master)AU.master.gain.setTargetAtTime(m?0:0.7,AU.ctx.currentTime,.05)}
function tone(f,d,type='square',v=.15,f2=0,delay=0,dest){if(!AU.ctx)return;const a=AU.ctx,t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(dest||AU.sfx);o.start(t);o.stop(t+d+.03)}
function noise(d,v=.3,fc=1200,delay=0,ft='lowpass',dest){if(!AU.ctx)return;const a=AU.ctx,t=a.currentTime+delay;const s=a.createBufferSource();s.buffer=AU.nb;const f=a.createBiquadFilter();f.type=ft;f.frequency.value=fc;const g=a.createGain();
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(dest||AU.sfx);s.start(t,R()*0.5);s.stop(t+d+.03)}
const SFX={
 tackle(){noise(.18,.6,500);tone(140,.18,'sine',.5,45)},
 whiff(){noise(.12,.2,2500,0,'bandpass')},
 cuff(){tone(2200,.04,'square',.12);tone(1600,.05,'square',.12,0,.06);tone(2600,.06,'square',.1,0,.13)},
 donut(){[523,659,784,1046].forEach((f,i)=>tone(f,.09,'square',.12,0,i*.06))},
 blip(){tone(1320,.04,'square',.07)},
 select(){tone(880,.03,'square',.07)},
 radio(){noise(.12,.15,1800,0,'bandpass');tone(1400,.05,'square',.06,0,.12);tone(1000,.05,'square',.06,0,.18)},
 crash(){noise(.45,.7,350);tone(90,.3,'sawtooth',.25,40)},
 stamp(){noise(.08,.6,300);tone(70,.12,'sine',.5,40)},
 ticket(){tone(660,.05,'square',.1);tone(990,.08,'square',.1,0,.06)},
 error(){tone(200,.25,'sawtooth',.15,90)},
 success(){[392,523,659,784,1046].forEach((f,i)=>tone(f,.12,'square',.12,0,i*.07))},
 fanfare(){[523,523,523,659,784,659,784,1046].forEach((f,i)=>tone(f,.14,'square',.13,0,i*.1))},
 honk(){tone(380,.22,'square',.08);tone(470,.22,'square',.08)},
 door(){tone(300,.08,'triangle',.2,500)},
 step(){noise(.03,.05,800)},
 hurt(){tone(300,.2,'square',.15,100);noise(.1,.3,800)},
 type(){tone(1800+R()*400,.015,'square',.03)}};
function sirenUpdate(on){if(!AU.ctx)return;const a=AU.ctx;
 if(on&&!AU.siren){const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type='sawtooth';f.type='lowpass';f.frequency.value=2200;g.gain.value=0;o.connect(f);f.connect(g);g.connect(AU.sfx);o.start();AU.siren={o,g}}
 if(AU.siren){const t=a.currentTime;AU.siren.g.gain.setTargetAtTime(on?0.07:0,t,.05);if(on){const ph=(t*0.9)%1;AU.siren.o.frequency.setTargetAtTime(ph<.5?650+ph*2*500:1150-(ph-.5)*2*500,t,.03)}}}
// chiptune: Am - F - C - G with a cop-show groove
const SONG={bass:[45,45,57,45,41,41,53,41,48,48,60,48,43,43,55,47],lead:[69,0,72,0,76,74,72,0,65,0,69,72,0,74,72,69,67,0,72,0,76,0,79,77,71,74,0,71,67,0,69,0]};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function musicTick(){if(!AU.ctx||AU.ctx.state!='running')return;const a=AU.ctx;const bpm=AU.intense?150:112,s8=60/bpm/2;
 if(AU.next<a.currentTime-1)AU.next=a.currentTime+.05;
 while(AU.next<a.currentTime+0.25){const st=AU.step,t=AU.next-a.currentTime;const bar=(st>>3)%4;
  const bn=SONG.bass[bar*4+((st>>1)&3)];if(st%2==0||AU.intense)tone(mtof(bn-12+(st%4==2?12:0)),s8*.9,'triangle',.5,0,t,AU.mus);
  const ln=SONG.lead[st%32];if(ln&&(st%64<32||AU.intense))tone(mtof(ln),s8*.8,'square',.13,0,t,AU.mus);
  if(st%4==2)noise(.04,.25,7000,t,'highpass',AU.mus);if(st%8==0)noise(.12,.5,180,t,'lowpass',AU.mus);if(AU.intense&&st%8==4)noise(.1,.35,1500,t,'bandpass',AU.mus);
  AU.step++;AU.next+=s8}}
// ---------- input
const keys={};const IN={pressA:false,pressB:false,run:false,joy:{id:null,ox:0,oy:0,x:0,y:0,rx:0,ry:0,R:60}};
function inputVec(){let x=IN.joy.x,y=IN.joy.y;if(keys.KeyA||keys.ArrowLeft)x-=1;if(keys.KeyD||keys.ArrowRight)x+=1;if(keys.KeyW||keys.ArrowUp)y-=1;if(keys.KeyS||keys.ArrowDown)y+=1;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}return{x,y,m:Math.min(1,m)}}
function smoothJoy(dt){const j=IN.joy;let x=j.rx,y=j.ry;const m=Math.hypot(x,y),dz=0.15;let k=0;if(m>dz)k=Math.min(1,(m-dz)/(1-dz))/m;const tx=x*k,ty=y*k;const f=1-Math.exp(-dt*22);j.x+=(tx-j.x)*f;j.y+=(ty-j.y)*f;if(j.id===null&&Math.abs(j.x)<.01&&Math.abs(j.y)<.01){j.x=j.y=0}}

// ---------- MAP  0 road,1 sidewalk,2 building,3 grass,4 path,5 water
const PP=P*T;
const map=new Uint8Array(N*N);
const tile=(x,y)=>(x<0||y<0||x>=N||y>=N)?2:map[(y|0)*N+(x|0)];
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const rx=x%P<3,ry=y%P<3;let t;if(rx||ry)t=0;else if(x%P==3||x%P==P-1||y%P==3||y%P==P-1)t=1;else t=2;map[y*N+x]=t}
const SPECIAL={'1,1':{type:'police',name:'POLICE',roof:'#3d4f8f',wall:'#27325e'},'3,3':{type:'donut',name:'DONUTS',roof:'#e88ab8',wall:'#a8507a'},'4,4':{type:'bank',name:'BANK',roof:'#c9c09a',wall:'#8a8060'},
 '2,4':{type:'jewel',name:'GLITTER&SONS',roof:'#7a5ca8',wall:'#4a3570'},'5,2':{type:'apart',name:'APARTMENTS',roof:'#9a6a4a',wall:'#5e3e2a'},'0,3':{type:'pawn',name:'PAWN SHOP',roof:'#6a7a5a',wall:'#45503a'},'4,1':{type:'park',name:'PARK'},'1,4':{type:'park2',name:'PLAZA'}};
const GENERIC=['LAUNDRY','PIZZA','ARCADE','TAXES','GYM','BOOKS','BODEGA','TATTOO','DINER','VIDEO','HAIR','KARATE','PETS','CLINIC','HOTEL','RECORDS','DELI','CAFE','BAR','THRIFT','GAMES','NAILS'];
const ROOFS=['#8a5a4a','#6e6e78','#5a6e8a','#8a7a5a','#5a7a6a','#9a8a7a','#7a5a7a','#6a5a4a','#4e5a6a','#a07050'];
const blocks={};{const gn=shuffle(GENERIC.slice());let gi=0;for(let by=0;by<BN;by++)for(let bx=0;bx<BN;bx++){const k=bx+','+by;const sp=SPECIAL[k];
 blocks[k]=sp?Object.assign({bx,by},sp):{bx,by,type:'shop',name:gn[gi++%gn.length],roof:pick(ROOFS),wall:null,split:R()<.55}}}
for(const k in blocks){const b=blocks[k];if(b.type=='park'||b.type=='park2'){for(let y=b.by*P+4;y<b.by*P+11;y++)for(let x=b.bx*P+4;x<b.bx*P+11;x++){const lx=x-b.bx*P,ly=y-b.by*P;let t=3;if(lx==7||ly==7)t=4;if(b.type=='park'&&lx>=8&&ly<=5&&lx<=9&&ly>=4)t=5;if(b.type=='park2')t=(lx==4||lx==10||ly==4||ly==10)?3:4;map[y*N+x]=t}}}
function doorOf(bx,by){return{x:(bx*P+7.5)*T,y:(by*P+11.5)*T-4}}
const blockAt=(x,y)=>blocks[Math.floor(x/PP)+','+Math.floor(y/PP)];
function findBlock(type){for(const k in blocks)if(blocks[k].type==type)return blocks[k]}
const STATION=doorOf(1,1),DONUT=doorOf(3,3);
const solidCity=(px,py)=>{const t=tile(px/T,py/T);return t==2||t==5};
const walkPed=t=>t==1||t==3||t==4;
const isCross=(tx,ty)=>tile(tx,ty)==0&&((tx%P<3&&(ty%P==3||ty%P==P-1))||(ty%P<3&&(tx%P==3||tx%P==P-1)));
// ---------- traffic lights (cycle 14s, green wave offsets)
const LCYC=14;let simT=0;
function light(kx,ky){const t=(simT+((kx*2.3+ky*3.7)%LCYC))%LCYC;return t<5.5?{ew:'g',ns:'r'}:t<7?{ew:'y',ns:'r'}:t<12.5?{ew:'r',ns:'g'}:{ew:'r',ns:'y'}}
// ---------- prerendered city
const LAMPS=[],PROPS=[];let CITY,WIN;
function noiseFill(g,x,y,w,h,base,cols,n){g.fillStyle=base;g.fillRect(x,y,w,h);for(let i=0;i<n;i++){g.fillStyle=pick(cols);g.fillRect(x+ri(0,w-1),y+ri(0,h-1),1,1)}}
function buildCity(){const[c,g]=mkCanvas(N*T,N*T);const[wc,wg]=mkCanvas(N*T,N*T);CITY=c;WIN=wc;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=map[y*N+x],X=x*T,Y=y*T;

const ATTR={hair:{label:'Hair',vals:['red','blonde','black','grey'],col:{red:'#c03020',blonde:'#e0c060',black:'#1a1410',grey:'#999'}},height:{label:'Height',vals:['tall','short']},shoes:{label:'Shoes',vals:['boots','sneakers','flip-flops']},habit:{label:'Habit',vals:['cigars','bubble gum','sunflower seeds']},ride:{label:'Ride',vals:['scooter','van','unicycle']}};

function clueText(src,cat,v,thing){
 if(src=='witness'){return{hair:`"I saw 'em running off! Hair was ${v}. Like, REALLY ${v}."`,height:`"They were ${v}. ${v=='tall'?'Hit their head on the awning.':'Had to jump to reach the door handle.'}"`,shoes:`"I heard ${v=='boots'?'clomp clomp clomp':v=='sneakers'?'squeak squeak squeak':'flip flop flip flop'}. ${v}, definitely."`,habit:`"They smelled like ${v}. Strongly."`,ride:`"Got away on a ${v}! ${v=='unicycle'?'Very skilled, honestly.':'Fast, too.'}"`}[cat]}
 if(src=='scene'){return{hair:`A ${v} hair caught on the ${thing}.`,height:`Scuff marks ${v=='tall'?'high up':'very low'} on the wall. The perp is ${v}.`,shoes:`A muddy ${v} print next to the ${thing}.`,habit:`${HABITITEM[v]} near the ${thing}.`,ride:`Tire marks inside?! From a ${v}.`}[cat]}
 return{hair:`A ski mask with ${v} hair stuck in it.`,height:`A dropped coat, size ${v=='tall'?'XXL-TALL':'KIDS M'} — perp is ${v}.`,shoes:`A single abandoned ${v=='flip-flops'?'flip-flop':v=='boots'?'boot':'sneaker'}.`,habit:`${HABITITEM[v]}. And a receipt for ${v}.`,ride:`A parking ticket for a ${v}. Hmm.`}[cat]}
const SUSNAMES=['Big Sal','"Sprinkles" McGee','Prof. Cruller','Lady Fritter','Johnny Two-Cones','Madame Eclair','Knuckles Kowalski','Granny Smash','Dr. Jelly','Tiny Tony','Countess Crumb','Slick Rick Pfeiffer'];
function newCase(){const tpl=CASES[(SAVE.caseIdx||0)%CASES.length];const cats=shuffle(Object.keys(ATTR)).slice(0,3);
 const base={};for(const k in ATTR)base[k]=pick(ATTR[k].vals);const names=shuffle(SUSNAMES.slice());
 const sus=[{name:names[0],attrs:Object.assign({},base)}];
 for(let i=0;i<3;i++){const a=Object.assign({},base);const cat=cats[i];a[cat]=pick(ATTR[cat].vals.filter(v=>v!=base[cat]));for(const k in ATTR)if(!cats.includes(k)&&R()<.5)a[k]=pick(ATTR[k].vals);sus.push({name:names[i+1],attrs:a})}
 shuffle(sus);for(const s of sus){const L=randLook();L.hair=ATTR.hair.col[s.attrs.hair];L.hs=ri(1,6);L.hat=null;L.ht=s.attrs.height=='tall'?2:0;L.old=false;s.L=L;s.img=null}
 const culprit=sus.find(s=>cats.every(c=>s.attrs[c]==base[c]));
 const srcs=shuffle(['scene','witness','item']).map((src,i)=>({src,cat:cats[i],val:base[cats[i]],found:false}));
 const C={tpl,sus,culprit,srcs,stage:'investigate',accused:[]};
 const sb=findBlock(tpl.scene);
 for(const s of C.srcs){s.text=clueText(s.src,s.cat,s.val,tpl.thing);
  if(s.src=='scene'){const I=INTERIORS[tpl.scene];s.ix=rnd(3,10)*T;s.iy=rnd(4,7)*T}
  if(s.src=='item'){let t;do{t=randTile(v=>v==1)}while(Math.hypot(t.x*T-sb.bx*PP,t.y*T-sb.by*PP)<PP*1.5);s.x=(t.x+.5)*T;s.y=(t.y+.5)*T}
  if(s.src=='witness'){const b=pick(Object.values(blocks).filter(b=>b!=sb&&b.type!='police'));const w=mkPed();const d=doorOf(b.bx,b.by);w.x=d.x+20;w.y=d.y+6;w.state='witness';w.witness=s;w.name=rname();w.L.hat='#fd3';s.ped=w;s.where=b.name;peds.push(w)}}
 S.case=C}
function evidenceBoard(){const C=S.case;if(!C){dlg('Evidence Board','<i>Board is empty. Krupke is "working on it."</i>',[['Close']]);return}
 const known=C.srcs.filter(s=>s.found);
 let h=`<div style="margin-bottom:6px"><b>${C.tpl.title}</b><br><small>${C.tpl.intro}</small></div><div class="board">`;
 h+=C.srcs.map(s=>`<div class="note">${s.found?'📌 '+s.text:`❓ <i>${s.src=='scene'?'Search the crime scene: '+findBlock(C.tpl.scene).name:s.src=='witness'?'Find the witness near '+s.where+' (yellow cap)':'Find dropped evidence (yellow ✦ on map)'}</i>`}</div>`).join('');
 h+='</div><div class="board" style="margin-top:6px">';
 C.sus.forEach((s,i)=>{if(!s.img)s.img=portraitURL(s.L);const out=known.some(k=>s.attrs[k.cat]!=k.val)||C.accused.includes(i);
  h+=`<div class="sus ${out?'out':''}"><img src="${s.img}"><br><b>${s.name}</b><br>${Object.keys(ATTR).map(k=>`${ATTR[k].label}: ${s.attrs[k]}`).join('<br>')}<button data-i="${i}">ACCUSE</button></div>`});
 h+='</div>';

 if(C.stage!='investigate'){[...document.querySelectorAll('.sus button')].forEach(b=>b.remove());return}

 else{C.accused.push(i);repChange(-6);SFX.error();vib(120);dlg('Wrong Suspect',say('SGT KRUPKE',`${s.name} has an alibi: ${pick(['they were at a book club for people who hate donuts','they were stuck in a revolving door all night','they were judging a pie contest. Twelve witnesses. All full.','they were literally in our holding cell'])}. -6 rep. Think, detective!`),[['Hmm...']])}}

const QUIRKS=[{n:'a softie',good:2,bad:-1,donut:2},{n:'a tough nut',good:-.5,bad:2,donut:1},{n:'a hungry type',good:1,bad:0,donut:3.5},{n:'a drama queen',good:1.2,bad:1.2,donut:1},{n:'a chatterbox',good:1.5,bad:.5,donut:1.5}];
function interrogate(h){const p=h.p,q=pick(QUIRKS);let coop=1,anger=0,round=0;const crime=CR[p.crime]||CR.shoplift;S.inter={p};
 const G=['"Look, we all make mistakes. Wanna talk?"','"Rough week? Mine too. Tell me about it."','"You seem decent, under all the crime."','"I believe in you. Do you believe in you?"'];
 const B=['*SLAMS TABLE* "TALK!"','"Your buddy already ratted you out!" (he did not)','*leans in uncomfortably close*','"I have ALL. NIGHT." (shift ends at 8)'];
 const UP=['"...okay, maybe I did a LITTLE crime."','"Fine! I was framed! By my own hands!"','*sobs* "It was the sprinkles, they MADE me!"','"Can I get that in writing? The donut, I mean."'];
 const DN=['"I want my lawyer. And a sandwich."','"I know my rights! I watched a TV show once!"','*stares at the wall*','"Is that mirror one-way? Hi mom!"'];
 function step(txt){const meter=`<div>Cooperation</div><div class="meter"><i style="width:${Math.min(100,coop*20)}%;background:#3c6"></i></div><div>Anger</div><div class="meter"><i style="width:${Math.min(100,anger*25)}%;background:#c33"></i></div>`;
  if(coop>=5){h.interrogated=true;h.conf=true;S.stats.conf++;let extra='';const C=S.case;
   if(C&&C.stage=='investigate'){const un=C.srcs.find(s=>!s.found);if(un&&R()<.7)extra=`<br><br>🕵 <i>"Also... about ${C.tpl.title}? ${un.src=='witness'?`There's a witness hanging round ${un.where}. Yellow cap.`:un.src=='scene'?`Check inside ${findBlock(C.tpl.scene).name}. Cops missed something.`:'Somebody dropped something on the sidewalk. It sparkles.'}"</i>`}
   SFX.success();dlg('Confession!',`${p.name} sings like a canary. +120 pts, +3 rep.${extra}`,[['To the paperwork... 😩',()=>{S.score+=120;repChange(3);S.inter=null}]]);return}
  if(anger>=4||round>=5){h.interrogated=true;dlg('Lawyered Up',`${p.name} refuses to say more. ${anger>=4?'You may have yelled a bit. -2 rep.':'Out of time.'}`,[['Ugh. Paperwork.',()=>{if(anger>=4)repChange(-2);S.inter=null}]]);return}
  dlg('🗣 Interrogation — '+p.name,`<i>Charge: ${crime.n}. Your gut says they're ${q.n}. Round ${round+1}/5</i><br><br>${txt}<br>${meter}`,[
   ['😇 Good cop: '+pick(G),()=>{round++;coop+=q.good;if(q.good<0)anger+=.5;step(say(p.name,q.good>0?pick(UP):pick(DN)))}],
   ['😠 Bad cop: '+pick(B),()=>{round++;coop+=q.bad;anger+=1;S.shake=.2;vib(40);SFX.stamp();step(say(p.name,q.bad>0?pick(UP):pick(DN)))}],
   ['🍩 Offer donut'+(S.donuts?` (${S.donuts})`:' (none)'),()=>{round++;if(S.donuts>0){S.donuts--;coop+=q.donut;anger=Math.max(0,anger-1);step(say(p.name,'"...is this... Boston Cream?" *eyes moisten*'))}else step('<i>You pat your pockets. No donuts. Awkward.</i>')}],
   ['🤐 Silent stare',()=>{round++;if(R()<.4){coop+=2;step(say(p.name,'"OKAY STOP LOOKING AT ME LIKE THAT."'))}else step('<i>They stare back. You both blink. Nobody wins.</i>')}],
   ['🚪 Skip (no bonus)',()=>{h.interrogated=true;S.inter=null}]])}
 step(`<i>${p.name} sits across the table, sweating. The lamp buzzes. The coffee machine gurgles ominously.</i>`)}

function typo(s){const a=s.split('');const i=ri(1,a.length-2);const m=ri(0,3);if(m==0)[a[i],a[i+1]]=[a[i+1],a[i]];else if(m==1)a[i]=pick('aeiouxzqk'.split(''));else if(m==2)a.splice(i,0,a[i]);else a.splice(i,1);return a.join('')}
function paperwork(h){const p=h.p;let errors=0,stage=0;const crime=CR[p.crime]||CR.shoplift;const t0=performance.now();
 const forms=['Form 27-B/6 (Arrest Report)','Form 99-Q (Feelings About Arrest)','Form 12-Z (Request For More Forms)','Form 404 (Form Not Found)'];
 const hdr=()=>`<small>⏱ ${((performance.now()-t0)/1000|0)}s · ❌ ${errors}</small><br>`;
 function next(){stage++;
  if(stage==1){const opts=[p.name];while(opts.length<4){const t=typo(p.name);if(!opts.includes(t))opts.push(t)}shuffle(opts);
   dlg('📝 '+forms[0],hdr()+'Box 1: Suspect\'s full legal name, spelled <b>correctly</b>:',opts.map(o=>[o,()=>{if(o!=p.name){errors++;SFX.error();floatTxt(me.x,me.y-24,'TYPO!','#f55')}else SFX.type();next()}]))}
  else if(stage==2){const codes=Object.values(CR).map(c=>c.code+' – '+c.n);codes.push('10-WTF – Unspecified Weirdness','10-4 – Copy That');
   dlg('📝 '+forms[0],hdr()+'Box 7c: Select the crime code. Sgt. Krupke is watching.',shuffle(codes).slice(0,5).concat([crime.code+' – '+crime.n]).filter((v,i,a)=>a.indexOf(v)==i).sort(()=>R()-.5).map(c=>[c,()=>{if(!c.startsWith(crime.code+' ')){errors++;SFX.error()}next()}]))}
  else if(stage==3){const tm=S.time;const real=`${String(tm/60|0).padStart(2,'0')}:${String(tm%60|0).padStart(2,'0')}`;const fake=[real,`${String((tm/60|0)+1).padStart(2,'0')}:${String(tm%60|0).padStart(2,'0')}`,`${String(tm/60|0).padStart(2,'0')}:${String((tm+17)%60|0).padStart(2,'0')}`,'25:61'];
   dlg('📝 '+forms[3],hdr()+'Box 0: Current time (see your watch, top-left):',shuffle(fake).map(f=>[f,()=>{if(f!=real){errors++;SFX.error()}next()}]))}
