<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a"><meta name="mobile-web-app-capable" content="yes">
<title>BEAT COP: Donut Justice</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0d1a;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:"Courier New",monospace;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#c{position:fixed;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.px{font-weight:bold;text-transform:uppercase;letter-spacing:1px;text-shadow:2px 2px 0 #000}
#hud{position:fixed;left:6px;top:6px;pointer-events:none;font-size:12px;line-height:15px}
#hud .row{background:rgba(8,10,25,.72);border:2px solid #000;box-shadow:inset 0 0 0 1px #445;padding:3px 6px;margin-bottom:3px;display:inline-block}
.bar{height:7px;width:110px;background:#222;border:1px solid #000;margin:2px 0;position:relative}.bar i{display:block;height:100%}
.bar b{position:absolute;left:-14px;top:-4px;font-size:9px}
#radio{position:fixed;left:6px;top:58px;font-size:11px;line-height:14px;overflow:hidden;cursor:pointer}
#radio div{background:rgba(0,20,0,.75);border-left:3px solid #4f4;padding:2px 5px;white-space:nowrap;overflow:hidden}
#radio .tk{display:inline-block}#radio .q{color:#fff;background:#363;padding:0 3px}
@keyframes tk{0%,22%{transform:translateX(0)}92%,100%{transform:translateX(var(--dx))}}
#obj{position:fixed;left:50%;transform:translateX(-50%);pointer-events:none;font-size:12px;color:#ffe066;background:rgba(0,0,0,.6);padding:3px 8px;border:2px solid #000;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
.btn{position:fixed;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(255,255,255,.08));border:3px solid rgba(255,255,255,.75);box-shadow:0 3px 0 rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;text-align:center;touch-action:none;color:#fff;text-shadow:2px 2px 0 #000;line-height:1.05}
.btn.on{background:radial-gradient(circle,rgba(255,220,80,.6),rgba(255,150,0,.25));transform:scale(.94)}
.btn small{font-size:.62em;letter-spacing:0}
#bA{border-color:#7f7}#bB{border-color:#7cf}#bS{border-color:#fc6}#bH{border-color:#f66}
.tb{position:fixed;top:6px;width:38px;height:38px;background:rgba(8,10,25,.8);border:2px solid #889;display:flex;align-items:center;justify-content:center;font-size:17px;touch-action:none}
#modal{position:fixed;inset:0;display:none;z-index:9;align-items:flex-end;justify-content:center;background:linear-gradient(transparent 35%,rgba(0,0,0,.55))}
#modal.full{align-items:center;background:rgba(5,6,20,.82)}
#box{background:#1a1d33;border:4px solid #000;box-shadow:inset 0 0 0 3px #fc3,0 6px 0 rgba(0,0,0,.5);padding:12px 14px;max-width:560px;width:96%;max-height:72%;overflow:auto;font-size:14px;margin-bottom:8px;touch-action:pan-y}
#modal.full #box{max-height:90%;margin:0}
#box h2{margin:0 0 6px;color:#fc3;font-size:16px;text-transform:uppercase;text-shadow:2px 2px 0 #000;letter-spacing:1px}
#box .who{color:#7cf;font-weight:bold;text-transform:uppercase}
#box button{display:block;width:100%;margin:6px 0;padding:10px;font:bold 14px "Courier New",monospace;background:#2c3263;color:#fff;border:3px solid #000;box-shadow:inset 0 0 0 2px #6a74c9,0 3px 0 #000;text-align:left;touch-action:manipulation}
#box button:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px #9aa4f9}
#box button.dim{opacity:.45}
.meter{height:10px;background:#111;border:1px solid #000;margin:3px 0}.meter i{display:block;height:100%}
.board{background:#8a5a2b;border:6px solid #4a2d10;padding:8px;display:flex;flex-wrap:wrap;gap:6px}
.note{background:#fff7a8;color:#222;padding:5px;font-size:12px;transform:rotate(-1deg);box-shadow:2px 2px 0 rgba(0,0,0,.4);flex:1 1 45%}
.sus{background:#eee;color:#111;padding:4px;font-size:11px;width:calc(50% - 4px);text-align:center;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
.sus.out{opacity:.35;text-decoration:line-through}.sus img{width:48px;height:64px;image-rendering:pixelated;background:#9ab}
.sus button{padding:5px!important;text-align:center!important;font-size:12px!important}
#title{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6vh;pointer-events:none}
#title .menu{pointer-events:auto;width:min(340px,86vw)}
#title button{display:block;width:100%;margin:7px 0;padding:12px;font:bold 17px "Courier New",monospace;background:#2c3263;color:#fff;border:3px solid #000;box-shadow:inset 0 0 0 2px #6a74c9,0 4px 0 #000;text-transform:uppercase;letter-spacing:1px}
#title button.go{background:#1d6b2f;box-shadow:inset 0 0 0 2px #6f6,0 4px 0 #000}
#title .career{font-size:12px;text-align:center;background:rgba(0,0,0,.6);padding:6px;border:2px solid #000;margin-bottom:6px}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:22px;color:#fc3;pointer-events:none;text-align:center;opacity:0;transition:opacity .3s;z-index:7}
#ver{position:fixed;right:4px;bottom:2px;font-size:9px;opacity:.5;pointer-events:none;z-index:9}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" class="px"><div class="row"><span id="clock"></span> <span id="score"></span> <span id="rank"></span></div><br>
<div class="row" style="padding:3px 6px 3px 18px"><div class="bar"><b>HP</b><i id="hpb" style="background:linear-gradient(#f66,#b22)"></i></div><div class="bar"><b>ST</b><i id="stb" style="background:linear-gradient(#6cf,#27a)"></i></div><div class="bar"><b>RP</b><i id="rpb" style="background:linear-gradient(#fd6,#c80)"></i></div></div><br>
<div class="row" id="status" style="font-size:11px"></div></div>
<div id="radio" class="px"></div>
<div id="obj" class="px"></div>
<div id="toast" class="px"></div>
<div id="modal"><div id="box"></div></div>
<div id="title"><div class="menu"><div class="career px" id="career"></div>
<button class="go" id="tStart">▶ Start Shift</button><button id="tHelp">? How to play</button><button id="tSnd">♪ Sound: on</button></div></div>
<div id="ver"></div>
